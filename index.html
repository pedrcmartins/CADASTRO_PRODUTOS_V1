<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - POO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <header class="topo">
            <h1>Cadastro de Produtos do Pedro</h1>
            <div class="total">
                <span class="total-rotulo">Total em estoque</span>
                <strong id="total-estoque">R$ 0,00</strong>
            </div>
        </header>

        <main class="conteudo">
            <form id="produto-form">
                <div class="form-group form-nome">
                    <label for="nome">Nome do produto</label>
                    <input type="text" id="nome" placeholder="Ex. Notebook" required />
                </div>

                <div class="form-group">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" step="0.01" placeholder="Ex. 3500.00" required />
                </div>

                <div class="form-group">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" placeholder="Ex. 5" required />
                </div>

                <button type="submit" class="btn-primary">Adicionar Produto</button>
            </form>

            <div class="lista-topo">
                <h2>Produtos cadastrados</h2>
                <button id="limpar-tabela" class="btn-danger">Limpar tudo</button>
            </div>

            <div class="tabela-wrapper">
                <table id="tabela-produtos">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Qtd</th>
                            <th>Subtotal</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
